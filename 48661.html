        function App() {
            const [activeTab, setActiveTab] = useState('1');
            const [searchTerm, setSearchTerm] = useState('');
            
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('inventory_items_v3');
                return saved ? JSON.parse(saved) : INITIAL_ITEMS;
            });
            
            const [dailyInputs, setDailyInputs] = useState(() => {
                const savedInputs = localStorage.getItem('inventory_daily_inputs_v3');
                return savedInputs ? JSON.parse(savedInputs) : {};
            });

            const [toastMessage, setToastMessage] = useState('');
            const [isError, setIsError] = useState(false);

            useEffect(() => {
                localStorage.setItem('inventory_items_v3', JSON.stringify(items));
                localStorage.setItem('inventory_daily_inputs_v3', JSON.stringify(dailyInputs));
            }, [items, dailyInputs]);

            const showToast = (message, error = false) => {
                setToastMessage(message);
                setIsError(error);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const saveToCloud = () => {
                if (!db) {
                    showToast('خطأ: لم تقم بوضع أكواد Firebase في الكود!', true);
                    return;
                }
                showToast('جاري الحفظ في السحابة...');
                db.collection("inventory_data").doc("ahmed_ramzy_store").set({
                    items: items,
                    dailyInputs: dailyInputs,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => showToast('تم الحفظ في السحابة بنجاح!'))
                .catch((error) => {
                    console.error("Error writing document: ", error);
                    showToast('حدث خطأ أثناء الحفظ، تأكد من إعدادات Firebase', true);
                });
            };

            const loadFromCloud = () => {
                if (!db) {
                    showToast('خطأ: لم تقم بوضع أكواد Firebase في الكود!', true);
                    return;
                }
                showToast('جاري التحميل من السحابة...');
                db.collection("inventory_data").doc("ahmed_ramzy_store").get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if(data.items) setItems(data.items);
                        if(data.dailyInputs) setDailyInputs(data.dailyInputs);
                        showToast('تم تحميل بياناتك من السحابة بنجاح!');
                    } else {
                        showToast('لا توجد بيانات محفوظة مسبقاً في السحابة.', true);
                    }
                }).catch((error) => {
                    console.error("Error getting document:", error);
                    showToast('حدث خطأ أثناء التحميل', true);
                });
            };

            const processedData = useMemo(() => {
                const daysData = {};
                const previousBalances = {}; 

                items.forEach(item => { previousBalances[item.id] = 0; });

                for (let day = 1; day <= 31; day++) {
                    daysData[day] = items.map(item => {
                        const input = dailyInputs[day]?.[item.id] || {};
                        const opening = day === 1 ? (parseFloat(input.manualOpening) || 0) : previousBalances[item.id];
                        const receipts = parseFloat(input.receipts) || 0;
                        const out1 = parseFloat(input.out1) || 0;
                        const out2 = parseFloat(input.out2) || 0;
                        const out3 = parseFloat(input.out3) || 0;
                        const out4 = parseFloat(input.out4) || 0;

                        const totalReceived = opening + receipts;
                        const receivedPriceValue = receipts * item.price; // قيمة المستلم لليوم = الاستلامات * السعر
                        
                        const totalIssued = out1 + out2 + out3 + out4;
                        const issuedPriceValue = totalIssued * item.price;
                        
                        const finalBalance = totalReceived - totalIssued;
                        const finalBalanceValue = finalBalance * item.price;

                        previousBalances[item.id] = finalBalance;

                        return {
                            ...item,
                            opening, receipts, out1, out2, out3, out4,
                            totalReceived, receivedPriceValue, totalIssued, issuedPriceValue, finalBalance, finalBalanceValue
                        };
                    });
                }
                return daysData;
            }, [items, dailyInputs]);

            const generalReportData = useMemo(() => {
                return items.map(item => {
                    let totalReceipts = 0, totalOut1 = 0, totalOut2 = 0, totalOut3 = 0, totalOut4 = 0;

                    for (let day = 1; day <= 31; day++) {
                        const dayRecord = processedData[day].find(d => d.id === item.id);
                        if(dayRecord) {
                            totalReceipts += dayRecord.receipts;
                            totalOut1 += dayRecord.out1;
                            totalOut2 += dayRecord.out2;
                            totalOut3 += dayRecord.out3;
                            totalOut4 += dayRecord.out4;
                        }
                    }

                    const opening = processedData[1].find(d => d.id === item.id)?.opening || 0;
                    const totalReceived = opening + totalReceipts;
                    
                    const receivedPriceValue = totalReceived * item.price; // قيمة المستلم للعام = إجمالي المستلم * السعر
                    
                    const totalIssued = totalOut1 + totalOut2 + totalOut3 + totalOut4;
                    const issuedPriceValue = totalIssued * item.price;
                    
                    const finalBalance = totalReceived - totalIssued;
                    const finalBalanceValue = finalBalance * item.price;

                    return {
                        ...item,
                        opening, receipts: totalReceipts, out1: totalOut1, out2: totalOut2, out3: totalOut3, out4: totalOut4,
                        totalReceived, receivedPriceValue, totalIssued, issuedPriceValue, finalBalance, finalBalanceValue
                    };
                });
            }, [items, processedData]);

            const filteredGeneralData = generalReportData.filter(item => item.name.includes(searchTerm));
            const filteredDailyData = processedData[activeTab]?.filter(item => item.name.includes(searchTerm)) || [];

            const handleInputChange = (day, itemId, field, value) => {
                setDailyInputs(prev => {
                    const dayData = prev[day] || {};
                    const itemData = dayData[itemId] || {};
                    return { ...prev, [day]: { ...dayData, [itemId]: { ...itemData, [field]: value } } };
                });
            };

            const handlePriceChange = (itemId, newPriceStr) => {
                const newPrice = parseFloat(newPriceStr);
                if(isNaN(newPrice)) return;
                
                setItems(prevItems => prevItems.map(item => 
                    item.id === itemId ? { ...item, price: newPrice } : item
                ));
            };

            const handleAddNewItem = () => {
                const newItemName = prompt("أدخل اسم الخامة الجديدة:");
                if (!newItemName) return;
                const newItemUnit = prompt("أدخل الوحدة (مثل: كيلو، قطعة):") || 'وحدة';
                const newItemPrice = parseFloat(prompt("أدخل السعر:")) || 0;

                const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
                setItems([...items, { id: newId, name: newItemName, unit: newItemUnit, price: newItemPrice }]);
                
                showToast('تم إضافة الصنف بنجاح');
            };

            const handleClearData = () => {
                const password = prompt("يرجى إدخال كلمة المرور لتأكيد مسح جميع البيانات:");
                
                if (password === "1234") {
                    if (window.confirm("تحذير أخير: هل أنت متأكد من مسح جميع الحركات والأرصدة المدخلة؟ (سيتم الاحتفاظ بالأصناف)")) {
                        setDailyInputs({});
                        showToast('تم مسح جميع الحركات بنجاح، يمكنك بدء شهر جديد');
                    }
                } else if (password !== null) {
                    showToast('كلمة المرور خاطئة! لم يتم مسح البيانات', true);
                }
            };

            const exportToExcel = () => {
                const excelData = generalReportData.map((item, index) => ({
                    'م': index + 1,
                    'اسم الخامة': item.name,
                    'الوحدة': item.unit,
                    'السعر': item.price,
                    'رصيد بداية المدة': item.opening,
                    'الاستلامات': item.receipts,
                    'إجمالي المستلم': item.totalReceived,
                    'قيمة المستلم': item.receivedPriceValue,
                    'منصرف (شاورما مودز)': item.out1,
                    'منصرف (سرايا العرب)': item.out2,
                    'منصرف (سرايا إيليت)': item.out3,
                    'منصرف (سرايا دجله)': item.out4,
                    'إجمالي المنصرف': item.totalIssued,
                    'قيمة المنصرف': item.issuedPriceValue,
                    'الرصيد النهائي': item.finalBalance,
                    'قيمة الرصيد النهائي': item.finalBalanceValue
                }));

                const worksheet = XLSX.utils.json_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "الرصيد العام");
                
                if(!worksheet['!views']) worksheet['!views'] = [];
                worksheet['!views'][0] = { rightToLeft: true };

                XLSX.writeFile(workbook, "تقرير_الرصيد_العام_المخازن.xlsx");
                
                showToast('تم تحميل ملف الإكسل بنجاح');
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-4">
                    {toastMessage && (
                        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50 text-white font-bold ${isError ? 'bg-red-600' : 'bg-green-600'}`}>
                            {toastMessage}
                        </div>
                    )}

                    <div className="w-full max-w-[1500px] bg-white p-6 rounded-xl shadow-md mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border-t-4 border-blue-600">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <IconSpreadsheet /> نظام إدارة المخازن | أحمد رمزي
                            </h1>
                        </div>
                        
                        <div className="flex flex-wrap gap-2 justify-center">
                            <button onClick={saveToCloud} className="flex items-center gap-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-4 py-2 rounded-lg font-semibold transition-colors border border-indigo-200">
                                <IconCloudUp /> حفظ في السحابة
                            </button>
                            <button onClick={loadFromCloud} className="flex items-center gap-2 bg-purple-50 text-purple-700 hover:bg-purple-100 px-4 py-2 rounded-lg font-semibold transition-colors border border-purple-200">
                                <IconCloudDown /> تحميل من السحابة
                            </button>
                            <button onClick={handleAddNewItem} className="flex items-center gap-2 bg-blue-50 text-blue-700 hover:bg-blue-100 px-4 py-2 rounded-lg font-semibold transition-colors">
                                <IconPlus /> إضافة صنف
                            </button>
                            <button onClick={handleClearData} className="flex items-center gap-2 bg-red-50 text-red-700 hover:bg-red-100 px-4 py-2 rounded-lg font-semibold transition-colors">
                                <IconTrash /> تفريغ البيانات
                            </button>
                        </div>
                    </div>

                    <div className="w-full max-w-[1500px] mb-4 flex flex-col lg:flex-row justify-between items-center gap-4">
                        <div className="flex w-full lg:w-auto items-center gap-4">
                            <button onClick={() => setActiveTab('general')} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold transition-all shadow-sm ${activeTab === 'general' ? 'bg-blue-600 text-white shadow-blue-200' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>
                                <IconSave /> تقرير الرصيد العام
                            </button>
                            
                            <div className="flex items-center gap-3 bg-white p-2 px-4 rounded-lg shadow-sm w-full lg:w-64">
                                <IconCalendar />
                                <span className="font-semibold text-gray-700 whitespace-nowrap">اختر اليوم:</span>
                                <select value={activeTab !== 'general' ? activeTab : '1'} onChange={(e) => setActiveTab(e.target.value)} className="border-gray-300 rounded-md bg-gray-50 py-2 px-2 w-full focus:ring-blue-500 font-bold outline-none cursor-pointer">
                                    {[...Array(31)].map((_, i) => (
                                        <option key={i + 1} value={String(i + 1)}> يوم {i + 1}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="flex w-full lg:w-auto items-center gap-4">
                            <div className="relative w-full lg:w-80">
                                <IconSearch />
                                <input 
                                    type="text" 
                                    placeholder="ابحث عن خامة..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-4 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>
                            {activeTab === 'general' && (
                                <button onClick={exportToExcel} className="flex items-center gap-2 bg-green-600 text-white hover:bg-green-700 px-4 py-2 rounded-lg font-semibold transition-colors whitespace-nowrap shadow-sm">
                                    <IconDownload /> تصدير إكسل
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="w-full max-w-[1500px] bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
                        <div className="overflow-x-auto h-[65vh] table-container">
                            <table className="w-full text-sm text-right whitespace-nowrap">
                                <thead className="bg-gray-800 text-white sticky top-0 z-10 shadow-md">
                                    <tr>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center">م</th>
                                        <th className="px-3 py-3 border-b border-gray-700">اسم الخامة</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center">الوحدة</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center bg-gray-700">السعر</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-yellow-300">رصيد البداية</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-blue-300">الاستلامات</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center bg-gray-700">إجمالي المستلم</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-teal-300">قيمة المستلم</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-red-300">مودز</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-red-300">العرب</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-red-300">إيليت</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-red-300">دجله</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center bg-gray-700">إجمالي المنصرف</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center bg-gray-700">قيمة المنصرف</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-green-300 text-lg">الرصيد النهائي</th>
                                        <th className="px-3 py-3 border-b border-gray-700 text-center text-emerald-300 text-lg">قيمة الرصيد النهائي</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {activeTab === 'general' ? (
                                        filteredGeneralData.length > 0 ? filteredGeneralData.map((item, index) => (
                                            <tr key={item.id} className="hover:bg-blue-50">
                                                <td className="px-3 py-3 text-center text-gray-500">{index + 1}</td>
                                                <td className="px-3 py-3 font-bold text-blue-900">{item.name}</td>
                                                <td className="px-3 py-3 text-center text-gray-600">{item.unit}</td>
                                                <td className="px-1 py-3 text-center bg-gray-50">
                                                    <input type="number" value={item.price} onChange={(e) => handlePriceChange(item.id, e.target.value)} className="w-20 p-1 border border-gray-300 rounded text-center font-semibold focus:ring-2 focus:ring-blue-500 outline-none bg-white"/>
                                                </td>
                                                <td className="px-3 py-3 text-center font-bold text-yellow-600 bg-yellow-50">{item.opening}</td>
                                                <td className="px-3 py-3 text-center font-bold text-blue-600 bg-blue-50">{item.receipts}</td>
                                                <td className="px-3 py-3 text-center font-bold bg-gray-100">{item.totalReceived}</td>
                                                <td className="px-3 py-3 text-center font-bold text-teal-700 bg-teal-50">{item.receivedPriceValue.toFixed(2)}</td>
                                                <td className="px-3 py-3 text-center text-red-600">{item.out1}</td>
                                                <td className="px-3 py-3 text-center text-red-600">{item.out2}</td>
                                                <td className="px-3 py-3 text-center text-red-600">{item.out3}</td>
                                                <td className="px-3 py-3 text-center text-red-600">{item.out4}</td>
                                                <td className="px-3 py-3 text-center font-bold text-red-700 bg-red-50">{item.totalIssued}</td>
                                                <td className="px-3 py-3 text-center font-bold bg-gray-100">{item.issuedPriceValue.toFixed(2)}</td>
                                                <td className="px-3 py-3 text-center font-black text-lg text-green-700 bg-green-100">{item.finalBalance}</td>
                                                <td className="px-3 py-3 text-center font-black text-lg text-emerald-800 bg-emerald-100">{item.finalBalanceValue.toFixed(2)}</td>
                                            </tr>
                                        )) : (
                                            <tr><td colSpan="16" className="text-center py-8 text-gray-500">لا توجد خامات مطابقة للبحث</td></tr>
                                        )
                                    ) : (
                                        filteredDailyData.length > 0 ? filteredDailyData.map((item, index) => (
                                            <tr key={item.id} className="hover:bg-blue-50 focus-within:bg-blue-50">
                                                <td className="px-3 py-2 text-center text-gray-500">{index + 1}</td>
                                                <td className="px-3 py-2 font-bold text-gray-800">{item.name}</td>
                                                <td className="px-3 py-2 text-center text-gray-600">{item.unit}</td>
                                                <td className="px-1 py-2 text-center bg-gray-50">
                                                    <input type="number" value={item.price} onChange={(e) => handlePriceChange(item.id, e.target.value)} className="w-20 p-1 border border-gray-300 rounded text-center font-semibold focus:ring-2 focus:ring-blue-500 outline-none bg-white"/>
                                                </td>
                                                <td className="px-1 py-2 w-24">
                                                    {activeTab === '1' ? (
                                                        <input type="number" min="0" value={dailyInputs['1']?.[item.id]?.manualOpening ?? ''} onChange={(e) => handleInputChange('1', item.id, 'manualOpening', e.target.value)} className="w-full p-2 border border-yellow-400 rounded bg-yellow-50 focus:ring-2 outline-none text-center font-bold" placeholder="0" />
                                                    ) : (
                                                        <div className="w-full p-2 bg-gray-200 text-gray-600 border border-gray-300 rounded text-center font-bold cursor-not-allowed">{item.opening}</div>
                                                    )}
                                                </td>
                                                <td className="px-1 py-2 w-24"><input type="number" min="0" value={dailyInputs[activeTab]?.[item.id]?.receipts ?? ''} onChange={(e) => handleInputChange(activeTab, item.id, 'receipts', e.target.value)} className="w-full p-2 border border-blue-300 rounded focus:ring-2 outline-none text-center" placeholder="0" /></td>
                                                <td className="px-3 py-2 text-center font-bold bg-gray-100 border-x border-gray-200">{item.totalReceived}</td>
                                                <td className="px-3 py-2 text-center font-bold text-teal-700 bg-teal-50 border-r border-gray-200">{item.receivedPriceValue.toFixed(2)}</td>
                                                <td className="px-1 py-2 w-20"><input type="number" min="0" value={dailyInputs[activeTab]?.[item.id]?.out1 ?? ''} onChange={(e) => handleInputChange(activeTab, item.id, 'out1', e.target.value)} className="w-full p-2 border border-red-200 rounded outline-none text-center" placeholder="0" /></td>
                                                <td className="px-1 py-2 w-20"><input type="number" min="0" value={dailyInputs[activeTab]?.[item.id]?.out2 ?? ''} onChange={(e) => handleInputChange(activeTab, item.id, 'out2', e.target.value)} className="w-full p-2 border border-red-200 rounded outline-none text-center" placeholder="0" /></td>
                                                <td className="px-1 py-2 w-20"><input type="number" min="0" value={dailyInputs[activeTab]?.[item.id]?.out3 ?? ''} onChange={(e) => handleInputChange(activeTab, item.id, 'out3', e.target.value)} className="w-full p-2 border border-red-200 rounded outline-none text-center" placeholder="0" /></td>
                                                <td className="px-1 py-2 w-20"><input type="number" min="0" value={dailyInputs[activeTab]?.[item.id]?.out4 ?? ''} onChange={(e) => handleInputChange(activeTab, item.id, 'out4', e.target.value)} className="w-full p-2 border border-red-200 rounded outline-none text-center" placeholder="0" /></td>
                                                <td className="px-3 py-2 text-center font-bold text-red-700 bg-red-50 border-x border-gray-200">{item.totalIssued}</td>
                                                <td className="px-3 py-2 text-center font-bold bg-gray-100 border-l border-gray-200">{item.issuedPriceValue.toFixed(2)}</td>
                                                <td className="px-3 py-2 text-center font-black text-lg text-green-700 bg-green-100">{item.finalBalance}</td>
                                                <td className="px-3 py-2 text-center font-black text-lg text-emerald-800 bg-emerald-100 border-r border-gray-200">{item.finalBalanceValue.toFixed(2)}</td>
                                            </tr>
                                        )) : (
                                            <tr><td colSpan="16" className="text-center py-8 text-gray-500">لا توجد خامات مطابقة للبحث</td></tr>
                                        )
                                    )}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="bg-gray-50 p-4 border-t border-gray-200 text-sm text-gray-500 flex justify-between">
                            <p>لحفظ البيانات حتى لا تضيع، اضغط على "حفظ في السحابة" بعد نهاية عملك.</p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
